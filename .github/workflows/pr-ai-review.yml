name: PR AI Description and Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-pr-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff summary
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD --stat)
          PATCH=$(git diff origin/${{ github.base_ref }}...HEAD | head -c 12000)
          echo "stat<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "patch<<EOF" >> $GITHUB_OUTPUT
          echo "$PATCH" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: OpenAI — описание PR
        id: describe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "## Описание изменений (локальный fallback)" >> $GITHUB_OUTPUT
            echo "Добавьте секрет OPENAI_API_KEY для автоматического описания." >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "${{ steps.diff.outputs.stat }}" >> $GITHUB_OUTPUT
            echo '```' >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          PROMPT="Опиши изменения в Pull Request для системы управления гостиницей (номера, бронирование, проживание, уборка). Кратко: Summary, Test plan."
          BODY=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg model "gpt-4o-mini" \
              --arg sys "Ты помощник для code review. Отвечай на русском в Markdown." \
              --arg user "$PROMPT\n\nСтатистика:\n${{ steps.diff.outputs.stat }}\n\nDiff:\n${{ steps.diff.outputs.patch }}" \
              '{model: $model, messages: [{role:"system", content:$sys}, {role:"user", content:$user}], temperature: 0.3}')" \
            | jq -r '.choices[0].message.content // "Не удалось получить ответ OpenAI"')
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: OpenAI — ревью кода
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "review<<EOF" >> $GITHUB_OUTPUT
            echo "### Автоматическое ревью" >> $GITHUB_OUTPUT
            echo "Секрет OPENAI_API_KEY не задан — проверьте SQL-инъекции, JWT, валидацию дат бронирования вручную." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          REVIEW=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg model "gpt-4o-mini" \
              --arg sys "Ты senior reviewer. Ищи: уязвимости, N+1, отсутствие обработки ошибок, проблемы с датами бронирования." \
              --arg user "Проведи ревью diff гостиницы:\n${{ steps.diff.outputs.patch }}" \
              '{model: $model, messages: [{role:"system", content:$sys}, {role:"user", content:$user}], temperature: 0.2}')" \
            | jq -r '.choices[0].message.content // "Review unavailable"')
          echo "review<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🤖 AI-описание изменений\n\n${process.env.DESCRIBE}\n\n---\n\n${process.env.REVIEW}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = "## 🤖 AI-описание изменений";
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          DESCRIBE: ${{ steps.describe.outputs.body }}
          REVIEW: ${{ steps.review.outputs.review }}
